name: WLED Hub
version: "0.2.0"
slug: wled_hub
description: Sync and control all your WLED devices as Sonos-style rooms, with a house-wide pixel grid
url: https://github.com/tobiasvalbjorn/W-led-syncmapper
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Host network: needed for mDNS discovery, UDP sync and DDP streaming to the LAN,
# and so phones on the LAN can open http://<home-assistant-ip>:8787 directly.
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:led-strip-variant
panel_title: WLED Hub
discovery:
  - wled_hub
map:
  - type: ssl
    read_only: true
options:
  port: 8787
  api_token: ""
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  log_level: info
schema:
  port: port
  api_token: password?
  ssl: bool
  certfile: str
  keyfile: str
  log_level: list(debug|info|warning|error)
